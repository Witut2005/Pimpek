<main class="room" [class]="'mood-' + store.avatarState()">
  <header class="hud">
    <span class="chip" title="Dni z rzędu z wpisem">
      🔥 {{ store.streak() }} {{ store.streak() === 1 ? 'dzień' : 'dni' }}
    </span>
    <h1>Pimpek</h1>
    <span class="chip" title="Ogólne samopoczucie Pimpka">❤️ {{ store.wellbeing() }}%</span>
  </header>

  <app-stat-gauges [stats]="store.stats()" />

  <section class="stage">
    @if (store.loading()) {
      <p class="loading">Pimpek się budzi… 💤</p>
    } @else {
      <app-pimpek
        [state]="store.avatarState()"
        [message]="store.bubbleMessage()"
        [items]="store.wornItems()"
        [celebrating]="celebrating()"
        [needsAttention]="!store.todayEntry()"
        (petClick)="openCheckIn()"
      />
    }
  </section>

  <nav class="dock">
    <button type="button" (click)="wardrobe.open()">
      <span aria-hidden="true">🎒</span> Szafa
    </button>
    <button type="button" class="main" (click)="openCheckIn()" [disabled]="store.loading()">
      <span aria-hidden="true">📝</span> {{ store.todayEntry() ? 'Edytuj wpis' : 'Dodaj wpis' }}
    </button>
    <button type="button" (click)="history.open()">
      <span aria-hidden="true">📅</span> Historia
    </button>
  </nav>
</main>

<app-check-in-dialog (saved)="onSaved($event)" />

<app-sheet #wardrobe title="Szafa Pimpka">
  <app-wardrobe />
</app-sheet>

<app-sheet #history title="Ostatnie 2 tygodnie">
  <app-history />
</app-sheet>

@if (unlockedToast(); as item) {
  <div class="toast" role="status">
    <span class="toast-icon" aria-hidden="true">{{ item.icon }}</span>
    <div>
      <strong>Nowy przedmiot!</strong>
      <div>{{ item.name }}</div>
    </div>
    <button type="button" class="btn primary" (click)="wearUnlocked(item)">Załóż</button>
  </div>
}
