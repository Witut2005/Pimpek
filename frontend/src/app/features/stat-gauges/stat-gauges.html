<ul aria-label="Jak się czuje Pimpek">
  @for (g of gauges(); track g.key) {
    <li [class]="g.level">
      <button
        type="button"
        (click)="select.emit(g.key)"
        [attr.aria-label]="g.label + ': ' + g.word + '. Pokaż szczegóły'"
      >
        <span
          class="pebble"
          role="meter"
          aria-valuemin="0"
          aria-valuemax="100"
          [attr.aria-valuenow]="g.value"
          [attr.aria-valuetext]="g.word"
        >
          <app-icon [name]="g.icon" />
        </span>
        <span class="word" aria-hidden="true">{{ g.word }}</span>
      </button>
    </li>
  }
</ul>
