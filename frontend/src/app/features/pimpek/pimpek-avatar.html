<svg viewBox="160 60 780 850" aria-hidden="true">
  <defs>
    <clipPath [attr.id]="ids.eyes"><path [attr.d]="paths.eyeSockets" /></clipPath>
    <clipPath [attr.id]="ids.body"><path [attr.d]="paths.bodyOutline" /></clipPath>
    <clipPath [attr.id]="ids.grin">
      <path d="M445 605 Q548 720 651 605 Q548 640 445 605 Z" />
    </clipPath>
    <clipPath [attr.id]="ids.partyHat"><path d="M455 268 L540 95 L625 255 Z" /></clipPath>
  </defs>

  <g class="body-group">
    <path class="body" [attr.d]="paths.body" fill-rule="evenodd" />
    <path class="eye-white" [attr.d]="paths.eyeWhites" />
    <path class="eye-shade" [attr.d]="paths.eyeShade" fill-rule="evenodd" />
    <path class="pupils" [attr.d]="paths.pupils" fill-rule="evenodd" />
    <g [attr.clip-path]="url(ids.eyes)">
      <rect class="eyelid" x="360" y="390" width="380" height="195" />
    </g>
    <path class="brow brow-left" [attr.d]="paths.browLeft" />
    <path class="brow brow-right" [attr.d]="paths.browRight" />

    @switch (state()) {
      @case ('happy') {
        <path class="ink" d="M445 605 Q548 720 651 605 Q548 640 445 605 Z" />
        <ellipse
          [attr.clip-path]="url(ids.grin)"
          cx="548"
          cy="662"
          rx="45"
          ry="22"
          fill="#ff7b9c"
        />
      }
      @case ('neutral') {
        <path class="ink" [attr.d]="paths.smile" />
      }
      @case ('sleepy') {
        <ellipse class="ink yawn" cx="548" cy="630" rx="22" ry="28" />
      }
      @case ('sad') {
        <path class="ink-line" d="M482 652 Q548 598 614 652" />
        <path class="drop tear" d="M425 578 C410 603 407 618 425 623 C443 618 440 603 425 578 Z" />
      }
      @case ('sick') {
        <path class="ink-line" d="M470 632 Q489 616 509 632 T548 632 T587 632 T626 632" />
        <path class="drop sweat" d="M800 395 C785 420 782 435 800 440 C818 435 815 420 800 395 Z" />
      }
    }

    @if (wears().has('headband')) {
      <g [attr.clip-path]="url(ids.body)">
        <path class="band" d="M200 360 Q550 230 900 370" stroke="#ef476f" stroke-width="44" />
        <path class="band" d="M200 360 Q550 230 900 370" stroke="#fff" stroke-width="8" />
      </g>
    }
    @if (wears().has('sunglasses')) {
      <g class="sunglasses">
        <path d="M545 470 Q549 452 553 470" fill="none" stroke="#1f2233" stroke-width="14" />
        <ellipse cx="460" cy="488" rx="88" ry="70" />
        <ellipse cx="638" cy="488" rx="88" ry="70" />
        <path class="shine" d="M405 465 Q420 440 450 432 M583 465 Q598 440 628 432" />
      </g>
    }
    <!-- hats are drawn small and scaled up from their brim, so they stay seated on the head -->
    <g transform="translate(540 262) scale(1.3) translate(-540 -262)">
      @if (wears().has('party-hat')) {
        <g>
          <path d="M455 268 L540 95 L625 255 Z" fill="#ff6fb5" />
          <g [attr.clip-path]="url(ids.partyHat)" fill="#fff" opacity="0.85">
            <circle cx="520" cy="200" r="10" />
            <circle cx="560" cy="165" r="8" />
            <circle cx="505" cy="242" r="9" />
            <circle cx="585" cy="230" r="9" />
            <circle cx="545" cy="125" r="7" />
          </g>
          <circle cx="540" cy="95" r="22" fill="#ffd23f" />
        </g>
      }
      @if (wears().has('crown')) {
        <g stroke-linejoin="round">
          <path
            d="M440 262 L450 165 L497 215 L532 140 L567 215 L614 165 L624 252 Z"
            fill="#ffcf3f"
            stroke="#e0a100"
            stroke-width="8"
          />
          <circle cx="450" cy="165" r="11" fill="#ffcf3f" />
          <circle cx="532" cy="140" r="11" fill="#ffcf3f" />
          <circle cx="614" cy="165" r="11" fill="#ffcf3f" />
          <circle cx="532" cy="228" r="13" fill="#ef476f" />
          <circle cx="482" cy="236" r="9" fill="#4cc9f0" />
          <circle cx="582" cy="231" r="9" fill="#4cc9f0" />
        </g>
      }
      @if (wears().has('nightcap')) {
        <g>
          <path
            d="M440 268 C450 170 530 110 620 115 C690 118 740 160 760 215 C720 175 680 170 650 190 C640 215 640 235 640 250 Z"
            fill="#5b5bd6"
          />
          <path d="M500 190 l6 14 l15 1 l-12 9 l4 15 l-13 -8 l-13 8 l4 -15 l-12 -9 l15 -1 Z" fill="#ffd23f" />
          <path d="M590 150 l4 10 l11 1 l-9 7 l3 11 l-9 -6 l-9 6 l3 -11 l-9 -7 l11 -1 Z" fill="#ffd23f" />
          <path d="M432 272 Q540 230 652 258" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" />
          <circle cx="762" cy="218" r="24" fill="#fff" />
        </g>
      }
      @if (wears().has('chef-hat')) {
        <g fill="#fff" stroke="#d7dde3" stroke-width="6">
          <circle cx="475" cy="190" r="50" />
          <circle cx="610" cy="185" r="50" />
          <circle cx="542" cy="155" r="60" />
          <path d="M455 270 L462 205 L618 198 L628 258 Q540 246 455 270 Z" />
        </g>
      }
    </g>
  </g>
</svg>

<div class="fx" aria-hidden="true">
  @switch (state()) {
    @case ('sleepy') {
      <span class="z">Z</span><span class="z">z</span><span class="z">z</span>
    }
    @case ('happy') {
      <span class="spark">✨</span><span class="spark">💙</span>
    }
  }
  @if (celebrating()) {
    @for (b of burst; track $index) {
      <span class="burst" [style.--angle]="b.angle + 'deg'">{{ b.icon }}</span>
    }
  }
</div>
