<section class="card">
  <h3>Twój tydzień</h3>
  <ol class="faces">
    @for (face of faces(); track face.date) {
      <li [class.empty]="!face.state">
        @if (face.state; as state) {
          <app-pimpek-avatar [state]="state" [color]="settings.petHex()" [quiet]="true" />
        } @else {
          <span class="ghost" aria-hidden="true"></span>
        }
        <small>{{ face.label }}</small>
      </li>
    }
  </ol>
  <p class="muted">{{ weekSentence() }}</p>
</section>

<app-trainings />

@for (trend of trends(); track trend.key) {
  <details class="card trend" [open]="trend.open">
    <summary>
      <app-icon [name]="trend.meta.icon" />
      <span>{{ trend.meta.label }}</span>
      <app-icon class="chevron" name="chevron" />
    </summary>
    <app-soft-bars
      [bars]="trend.bars"
      [max]="trend.max"
      [goal]="trend.goal"
      [goalMode]="trend.meta.goalMode"
      [goalLabel]="trend.goalLabel"
    />
    <p class="muted">{{ trend.summary }}</p>
  </details>
}

<details class="card trend">
  <summary>
    <app-icon name="calendar" />
    <span>Dzień po dniu</span>
    <app-icon class="chevron" name="chevron" />
  </summary>
  <app-history />
</details>
